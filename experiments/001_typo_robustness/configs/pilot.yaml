# Pilot configuration (design/11 §11.2, Stage-1 and Stage-2 pilot).
#
# Purpose: validate the pipeline end-to-end, estimate per-cell discordant-pair
# rates (which fix the main-study sample size via Connor 1987), and surface
# failure modes — NOT to draw confirmatory conclusions.
#
# Pre-requisite: run tools/build_task_items.py once (with network access) to
# pre-fetch and pin the JSONL files at the paths below.

run_id: pilot
seed: 1729

# Dataset selection — registry-driven (tasks.DATASET_REGISTRY).
# 100 items per dataset exercises all task paths and estimates discordant-pair
# rates without requiring the full N=600 fetch on Colab. All four Core-4 datasets
# are included so the pilot validates the full contamination-contrast structure.
datasets:
  - key: gsm_symbolic_jsonl
    path: data/items/gsm_symbolic.jsonl
    item_count: 100
  - key: mmlu_pro_jsonl
    path: data/items/mmlu_pro.jsonl
    item_count: 100
  - key: gsm8k_jsonl
    path: data/items/gsm8k.jsonl
    item_count: 100
  - key: mmlu_jsonl
    path: data/items/mmlu.jsonl
    item_count: 100

is_confirmatory: false

max_new_tokens_reasoning: 512
max_new_tokens_multiple_choice: 256

# Primary severity per task type (design/06 §6.3 contingency, applied from the
# first pilot's p_d estimates; amendment logged in design/00 §0.5). One-line
# change if a rerun revises the decision. Feeds the Stage-1 gates computation.
primary_edit_budget_reasoning: 2
primary_edit_budget_mcq: 4

# Perturbation conditions. The pilot spans the primary regimes (A and B) and the
# operations/scopes/severities the main study will use, at low replication.
conditions:
  - name: regime_a_substitute_keyboard
    semantic_class: A
    operation: substitute
    selection_policy: keyboard_neighbor
    scope: anywhere
    edit_budgets: [1, 2, 4]
    source: synthetic

  - name: regime_a_delete_keyboard
    semantic_class: A
    operation: delete
    selection_policy: keyboard_neighbor
    scope: anywhere
    edit_budgets: [1, 2]
    source: synthetic

  - name: regime_a_substitute_content
    semantic_class: A
    operation: substitute
    selection_policy: keyboard_neighbor
    scope: content
    edit_budgets: [1, 2]
    source: synthetic

  - name: regime_a_informative_word
    semantic_class: A
    operation: substitute
    selection_policy: informative_word
    scope: answer_critical
    edit_budgets: [1, 2]
    source: synthetic

  # Discourse-particle insertion (filler words): see main.yaml for provenance.
  - name: regime_a_filler
    semantic_class: A
    operation: insert
    selection_policy: filler_word
    scope: anywhere
    edit_budgets: [1, 2]
    source: synthetic

  # Method A counterfactual (design/02 §2.5, design/06 §6.8): paired Low/High
  # fragmentation variants of the same word at the same budget — the primary
  # mediation contrast. Two perturbed requests per item x budget.
  - name: regime_a_fragmentation_matched
    semantic_class: A
    operation: substitute
    selection_policy: fragmentation_matched
    scope: anywhere
    edit_budgets: [1, 2]
    source: synthetic

  # Regime B lever (a): config-only — higher word counts, same DL band.
  - name: regime_b_real_word
    semantic_class: B
    operation: substitute
    selection_policy: real_word
    scope: anywhere
    edit_budgets: [2, 3, 4]
    source: synthetic

  # Regime C: deterministic meaning-change perturbations with computationally
  # verifiable gold answers (design/04 §4.7).
  #   MCQ items:       option-label permutation — gold tracked by content,
  #                    not by letter (Pezeshkpour & Hruschka 2023, arXiv:2308.11483).
  #   Reasoning items: operand swap on synthetic-template items only — new gold
  #                    recomputed via the template answer function.
  # The operation/scope/selection_policy fields are unused for Regime C; the
  # dispatch is determined solely by item type inside experiment._construct_regime_c.
  - name: regime_c_meaning_changing
    semantic_class: C
    operation: substitute
    selection_policy: keyboard_neighbor
    scope: anywhere
    edit_budgets: [0]
    source: synthetic
