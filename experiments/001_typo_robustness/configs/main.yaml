# Main study configuration (design/11 §11.3).
#
# Sample sizes are set so each confirmatory cell can detect ~5 points of paired
# degradation: Connor (1987) gives ~595 paired items at a discordant-pair rate of
# 0.19 (design/06 §6.3). Rehearsal v2's measured discordant rates give implied
# N of 338 (gsm8k), 443 (gsm_symbolic), 364 (mmlu_pro), and exactly 600 (mmlu);
# 720 per dataset covers the worst family with >=20% margin against the sampling
# error of those estimates, uniformly, and also satisfies the standing GSM8K
# N=720 contingency (design/00 section 0.5).
#
# This config is confirmatory: the run script must assert every model revision is
# pinned (inference.assert_revisions_pinned) before generating, and the dataset
# revisions must be pinned in the loaders.

run_id: main
seed: 1729

# Dataset selection: registry-driven (tasks.DATASET_REGISTRY).
# Run tools/build_task_items.py once (with network access) to pre-fetch and pin
# dataset revisions; it writes data/items/PROVENANCE.json with resolved HuggingFace
# SHAs. Re-running overwrites cleanly and updates the SHAs (safe and idempotent).
# To add a dataset, register it in tasks/registry.py and append its key here.
#
# Primary confirmatory (N=600, McNemar-powered):
#   gsm_symbolic_jsonl  : fresh arithmetic reasoning (contamination-controlled)
#   mmlu_pro_jsonl      : 10-option MCQ, subject-stratified
#
# Contamination contrasts (same N; run on all models; paired directly with primaries):
#   gsm8k_jsonl         : standard arithmetic reasoning (potential memorisation)
#   mmlu_jsonl          : standard 4-option MCQ (potential memorisation)
datasets:
  - key: gsm_symbolic_jsonl
    path: data/items/gsm_symbolic.jsonl
    item_count: 720
  - key: mmlu_pro_jsonl
    path: data/items/mmlu_pro.jsonl
    item_count: 720
  - key: gsm8k_jsonl
    path: data/items/gsm8k.jsonl
    item_count: 720
  - key: mmlu_jsonl
    path: data/items/mmlu.jsonl
    item_count: 720

is_confirmatory: true

max_new_tokens_reasoning: 768
# Raised 512 -> 768 (uniform across families) after rehearsal v2: at 512 the
# Llama models still truncated 11-25% of mmlu_pro chains of thought
# (llama_8b_awq 191/775 rows), while the p99 output length of *correct* clean
# answers was 440 tokens, so 768 is ~1.75x p99. Truncation only affects rows
# that would exceed the budget (~3% of rows), so the cost is <=~6% of output
# tokens. One shared budget across families keeps budget out of the family
# contrast. History: 256 -> 512 amendment logged in design/00 section 0.5
# (2026-07-22) after 21-38% mmlu_pro truncation in rehearsal v1; 512 -> 768
# logged there dated 2026-07-23.
max_new_tokens_multiple_choice: 768

# Primary severity per task type (design/06 §6.3 contingency, applied from the
# pilot's p_d estimates; amendment logged in design/00 §0.5).
primary_edit_budget_reasoning: 2
primary_edit_budget_mcq: 4

# Perturbation conditions (design/11 §11.4): keyboard-neighbor operations
# across all four Damerau-Levenshtein primitives (substitute, delete, insert,
# transpose), scope variations (anywhere / content / answer_critical), discourse-
# particle filler-word insertion (Regime A), whitespace merge (Regime A,
# "missed-space"), real-word shift (Regime B), homophone-only shift (Regime B),
# and deterministic meaning-change (Regime C).
#
# The ACOUSTIC ASR arm is deferred (design/00 §0.5, 2026-07-09); its text-side
# proxies run here: homophone-only Regime B (acoustic confusions), filler
# insertion (disfluency), missed-space (transcription boundary error). Each
# crosswalks to a HIVE voice-arm operator (fillers ↔ HIVE #9, homophone ↔
# HIVE #13, missed-space ↔ HIVE #21), giving the cross-modal comparison a
# shared operator axis.
conditions:
  - name: regime_a_substitute_keyboard
    semantic_class: A
    operation: substitute
    selection_policy: keyboard_neighbor
    scope: anywhere
    edit_budgets: [1, 2, 4, 8]
    source: synthetic

  - name: regime_a_delete_keyboard
    semantic_class: A
    operation: delete
    selection_policy: keyboard_neighbor
    scope: anywhere
    edit_budgets: [1, 2, 4]
    source: synthetic

  - name: regime_a_insert_keyboard
    semantic_class: A
    operation: insert
    selection_policy: keyboard_neighbor
    scope: anywhere
    edit_budgets: [1, 2, 4]
    source: synthetic

  - name: regime_a_transpose
    semantic_class: A
    operation: transpose
    selection_policy: keyboard_neighbor
    scope: anywhere
    edit_budgets: [1, 2, 4]
    source: synthetic

  # Discourse-particle insertion (filler words): insert tokens from the frozen
  # set {"uh", "um", "like", "so"} at eligible inter-word positions. Intent is
  # preserved definitionally (discourse particles carry no propositional content);
  # no rejection sampling is needed. Novel relative to prior typo-robustness work.
  # H1b lever (design/06 §6.8): fillers inflate token count WITHOUT fragmenting
  # any word, contrasted against keyboard substitution in the mediation fits.
  - name: regime_a_filler
    semantic_class: A
    operation: insert
    selection_policy: filler_word
    scope: anywhere
    edit_budgets: [1, 2]
    source: synthetic

  # Whitespace merge ("missed-space", exploratory): delete an inter-word space
  # so two words fuse into one token ("a week" → "aweek"). The merged token
  # goes through the standard Regime-A nonword rejection sampling (a merge
  # that lands on a real word, e.g. "a part" → "apart", is resampled).
  # Crosswalk: HIVE keyboard operator #21.
  - name: regime_a_missed_space
    semantic_class: A
    operation: delete
    selection_policy: whitespace
    scope: anywhere
    edit_budgets: [1, 2]
    source: synthetic

  - name: regime_a_substitute_content
    semantic_class: A
    operation: substitute
    selection_policy: keyboard_neighbor
    scope: content
    edit_budgets: [1, 2, 4]
    source: synthetic

  - name: regime_a_informative_word
    semantic_class: A
    operation: substitute
    selection_policy: informative_word
    scope: answer_critical
    edit_budgets: [1, 2]
    source: synthetic

  # Method A counterfactual (design/02 §2.5, design/06 §6.8): paired Low/High
  # fragmentation variants of the same word at the same budget: the primary
  # mediation contrast. Two perturbed requests per item x budget.
  - name: regime_a_fragmentation_matched
    semantic_class: A
    operation: substitute
    selection_policy: fragmentation_matched
    scope: anywhere
    edit_budgets: [1, 2]
    source: synthetic

  - name: regime_b_real_word
    semantic_class: B
    operation: substitute
    selection_policy: real_word
    scope: anywhere
    # edit_budgets controls the NUMBER of words substituted per item.
    # The within-word DL band is widened to 2 and phonetic homophones are
    # added automatically in make_regime_b_real_word_shift (design/02 §2.4).
    edit_budgets: [2, 3, 4]
    source: synthetic

  # Homophone-only Regime B: candidate pool restricted to CMU exact homophones
  # ("weather" → "whether"): the pure acoustic-confusion proxy. Items whose
  # words carry no homophone are excluded via the sidecar (the yield
  # record). Crosswalk: HIVE voice operator #13 (clean+homophone).
  - name: regime_b_homophone
    semantic_class: B
    operation: substitute
    selection_policy: homophone
    scope: anywhere
    edit_budgets: [1, 2]
    source: synthetic

  # Regime C: deterministic meaning-change perturbations with computationally
  # verifiable gold answers (design/04 §4.7).
  #   MCQ items:       option-label permutation, gold tracked by content,
  #                    not by letter (Pezeshkpour & Hruschka 2023, arXiv:2308.11483).
  #   Reasoning items: operand swap on synthetic-template items only, new gold
  #                    recomputed via the template answer function
  #                    (numeric-edit motivation: Xie et al. 2024, arXiv:2402.17916).
  # The operation/scope/selection_policy fields are unused for Regime C; the
  # dispatch is determined solely by item type inside experiment._construct_regime_c.
  - name: regime_c_meaning_changing
    semantic_class: C
    operation: substitute
    selection_policy: keyboard_neighbor
    scope: anywhere
    edit_budgets: [0]
    source: synthetic
