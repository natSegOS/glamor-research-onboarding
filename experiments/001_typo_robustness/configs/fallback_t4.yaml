# Reduced configuration for a single 16 GB T4 (e.g. free Colab), for debugging
# the full pipeline on real models before scaling to the cluster (design/07
# §7.9). NOT a confirmatory run — item counts are too small to power a claim.
#
# Use only the smallest models (Llama-3.2-1B/3B, or a single 7-8B AWQ model that
# fits in 16 GB) when running against this config.

run_id: fallback_t4
seed: 1729

reasoning_item_count: 60
multiple_choice_item_count: 40

include_reasoning: true
include_multiple_choice: true

multiple_choice_items_path: null
asr_items_path: null

is_confirmatory: false

max_new_tokens_reasoning: 384
max_new_tokens_multiple_choice: 200

conditions:
  - name: regime_a_substitute_keyboard
    semantic_class: A
    operation: substitute
    selection_policy: keyboard_neighbor
    scope: anywhere
    edit_budgets: [1, 2]
    source: synthetic

  - name: regime_b_real_word
    semantic_class: B
    operation: substitute
    selection_policy: real_word
    scope: anywhere
    edit_budgets: [1]
    source: synthetic

